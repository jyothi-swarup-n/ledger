version: '3.8'

services:
  kinetic-ledger:
    build: .
    args:
      VITE_API_URL: ${VITE_API_URL:-}
    container_name: kinetic-ledger
    restart: unless-stopped
    expose:
      - "80"
    ports:
      - "3050:80"
    environment:
      - NODE_ENV=production

  caddy:
    image: caddy:alpine
    container_name: kinetic-caddy
    restart: unless-stopped
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - kinetic-ledger

volumes:
  caddy_data:
  caddy_config:
